<body>

<div class="app" id="app">
<header class="topbar">
 <div class="brand"><span class="brand-name">Local-Probe</span></div>
 <div class="top-context"><span id="crumb">概览</span></div>
 <div class="top-actions"><button class="btn" id="localeBtn">中 / EN</button><button class="icon-btn" id="themeBtn" aria-label="主题"></button></div>
</header>
<aside class="sidebar" id="sidebar">
 <div class="side-project"><span class="project-icon" id="projectIcon"></span><div class="project-copy"><b>Local-Probe</b><small id="workspaceLabel">本地工作区</small></div><button class="icon-btn sidebar-toggle" id="sidebarToggle" aria-label="收起侧栏" aria-expanded="true">&lt;</button></div>
 <nav class="nav-list" id="pageNav" aria-label="页面导航"></nav>
 <button class="side-scope btn" data-action="permissions"><span class="side-scope-head" id="scopeSummary"></span><span class="side-scope-path mono" id="scopeSummaryMeta"></span></button>
</aside>
<main class="workspace" id="workspace">
<section class="page active" id="overview">
 <div class="page-head"><h1 class="page-title" tabindex="-1">概览</h1><button class="btn" data-page="access" id="manageButton"></button></div>
 <div class="metrics" id="metrics"></div>
 <div class="overview-layout">
  <div class="panel"><div class="panel-head"><span class="panel-title" id="topologyHeading"></span><span class="pill mono" id="topologyTag"></span></div><div class="panel-body" id="overviewFlow"></div></div>
  <div class="panel"><div class="panel-head"><span class="panel-title" id="controlHeading"></span></div><div class="panel-body" id="connectionControls"></div></div>
 </div>
 <div class="section-grid">
  <div class="panel"><div class="panel-head"><span class="panel-title" id="folderHeading"></span><button class="btn" data-page="access" id="allFolders"></button></div><div id="overviewRoots"></div></div>
  <div class="panel"><div class="panel-head"><span class="panel-title" id="recentHeading"></span><button class="btn" data-page="activity" id="allActivity"></button></div><div class="timeline" id="recentTimeline"></div></div>
 </div>
</section>
<section class="page" id="connections">
 <div class="page-head"><h1 class="page-title" tabindex="-1">连接</h1></div>
 <div class="panel"><div class="new-connection"><span class="node-icon" id="newConnectionIcon"></span><div class="row-text"><span class="row-name" id="newConnectionHeading"></span><span class="muted small" id="newConnectionDescription"></span></div><button class="btn primary" data-action="add-connection" id="addConnectionButton"></button></div></div>
 <div class="panel"><div class="panel-head"><span class="panel-title" id="historyHeading"></span><span class="pill mono" id="historyCount"></span></div><div class="table-wrap" id="connectionHistory"></div></div>
</section>
<section class="page" id="access">
 <div class="page-head"><h1 class="page-title" tabindex="-1">访问范围</h1><div class="toolbar"><button class="btn" data-action="permissions" id="permissionsButton"></button><button class="btn primary" data-action="add-root" id="addRootButton"></button></div></div>
 <div class="access-layout">
  <div class="panel"><div class="panel-head"><span class="panel-title" id="scopeHeading"></span></div><div class="file-tree" id="scopeTree"></div></div>
  <div class="panel"><div class="panel-head"><span class="panel-title" id="directoryHeading"></span><div class="scope-tools"><input class="input" id="rootSearch"><button class="icon-btn" data-action="scope-all" id="scopeAll"></button></div></div><div id="rootList"></div></div>
 </div>
</section>
<section class="page" id="activity">
 <div class="page-head"><h1 class="page-title" tabindex="-1">活动</h1><button class="btn" data-action="export" id="exportButton"></button></div>
 <div class="panel"><div class="activity-filters">
  <label><span id="workspaceFilterLabel"></span><select class="select" id="logWorkspace"></select></label>
  <label><span id="transportFilterLabel"></span><select class="select" id="logTransport"></select></label>
  <label><span id="resultFilterLabel"></span><select class="select" id="logFilter"></select></label>
  <label><span id="fromFilterLabel"></span><input class="input" type="datetime-local" id="logFrom"></label>
  <label><span id="untilFilterLabel"></span><input class="input" type="datetime-local" id="logUntil"></label>
  <label><span id="categoryFilterLabel"></span><select class="select" id="logCategory"></select></label>
 </div><div class="filter-bottom"><input class="input" id="logSearch"><button class="btn" data-action="reset-filters" id="resetFilters"></button></div></div>
 <div class="panel"><div class="panel-head"><span class="panel-title" id="sequenceHeading"></span><span class="pill mono" id="eventCount"></span></div><div class="timeline" id="activityTimeline"></div></div>
 <div class="panel"><div class="panel-head"><span class="panel-title" id="recordHeading"></span></div><div class="table-wrap" id="logTable"></div></div>
</section>
<section class="page" id="settings">
 <div class="page-head"><h1 class="page-title" tabindex="-1">设置</h1></div>
 <div class="settings-grid">
  <div class="panel"><div class="panel-head"><span class="panel-title" id="appearanceHeading"></span></div><div class="setting-group" id="appearanceSettings"></div></div>
  <div class="panel"><div class="panel-head"><span class="panel-title" id="aboutHeading"></span></div><div class="panel-body" id="aboutSettings"></div></div>
  <div class="panel"><div class="panel-head"><span class="panel-title" id="healthHeading"></span></div><div class="panel-body" id="healthSettings"></div></div>
  <div class="panel"><div class="panel-head"><span class="panel-title" id="backupHeading"></span></div><div class="panel-body" id="backupSettings"></div></div>
 </div>
</section>
</main>
</div>
<div class="backdrop" id="backdrop"></div><div class="toast" id="toast" role="status"></div>
<dialog id="editDialog" aria-labelledby="editTitle"><form id="editForm">
 <h2 id="editTitle"></h2><label for="itemName" id="nameLabel"></label><input class="input" id="itemName" maxlength="60" required>
 <div id="rootFields"><label for="itemPath" id="pathLabel"></label><div class="path-picker"><input class="input" id="itemPath" maxlength="260"><button class="btn" type="button" data-action="browse" id="browseButton"></button></div><p id="browseNote" class="inline-note" hidden></p><button class="btn" type="button" id="configImportButton" disabled title="后续只读导入用户选定配置文件中的工作目录">从 config.toml 导入</button><input type="file" id="folderPicker" webkitdirectory multiple hidden></div>
 <div id="connectionFields"><label for="itemTransport" id="itemTransportLabel"></label><select class="select" id="itemTransport" style="width:100%"><option value="openai">OpenAI Secure Tunnel</option><option value="cloudflare">Cloudflare Named Tunnel</option></select><div class="dialog-columns"><div><label for="itemPort" id="itemPortLabel"></label><input class="input" id="itemPort" type="number" min="1024" max="65535" value="8787"></div><div><label for="itemProfile" id="itemProfileLabel"></label><input class="input" id="itemProfile" maxlength="60" value="local-profile"></div></div></div>
 <div class="dialog-actions"><button type="button" class="btn" data-action="close-dialog" id="editCancel"></button><button class="btn primary" type="submit" id="editSubmit"></button></div>
</form></dialog>
<dialog id="confirmDialog" aria-labelledby="confirmTitle"><h2 id="confirmTitle"></h2><p id="confirmCopy"></p><div class="dialog-actions"><button class="btn" data-action="close-dialog" id="confirmCancel"></button><button class="btn danger" id="confirmRemove"></button></div></dialog>
<dialog id="navDialog" aria-labelledby="navTitle"><h2 id="navTitle" tabindex="-1"></h2><div class="nav-choices" id="quickNav"></div></dialog>
<dialog class="json-dialog" id="exportDialog" aria-labelledby="exportTitle"><h2 id="exportTitle"></h2><pre id="exportBody"></pre><div class="dialog-actions"><button class="btn" data-action="close-dialog" id="exportClose"></button></div></dialog>
<dialog class="permission-dialog" id="permissionDialog" aria-labelledby="permissionTitle"><form id="permissionForm"><h2 id="permissionTitle"></h2><p class="dialog-note" id="permissionNote"></p><label class="checkbox-row"><input type="checkbox" id="developerMode"><span id="developerModeLabel"></span></label><label for="permissionRoot" id="permissionRootLabel"></label><select class="select" id="permissionRoot" style="width:100%"></select><div class="rule-list" id="permissionRules"></div><label for="customPattern" id="customPatternLabel"></label><input class="input mono" id="customPattern" maxlength="100" placeholder="src/**/*.go"><p class="inline-note" id="permissionHelp"></p><div class="dialog-actions"><button type="button" class="btn" data-action="close-dialog" id="permissionCancel"></button><button type="submit" class="btn primary" id="permissionSave"></button></div></form></dialog>
<dialog id="maintenanceDialog" aria-labelledby="maintenanceTitle"><h2 id="maintenanceTitle"></h2><div id="maintenanceBody"></div><div class="dialog-actions"><button class="btn" data-action="close-dialog" id="maintenanceClose"></button><button class="btn primary" id="maintenanceConfirm" hidden></button></div></dialog>

function act(action,id){
 if(action==='add-root'||action==='add-connection'){openEdit(action==='add-root'?'root':'connection');return;}

 if(action==='use-connection'){useConnection(id);return;}
 if(action==='browse'){$('folderPicker').value='';$('folderPicker').click();return;}
 if(action==='permissions'){openPermissions();return;}
 if(action==='permissions-root'){openPermissions(id);return;}
 if(action==='resolve-root'){openEdit('root',id);return;}
 if(action==='toggle-group'){toggleTreeGroup(id);return;}
 if(action==='toggle-branch'){toggleTreeBranch(id);return;}
 if(action==='run-command'){runCommand(id);return;}
 if(action==='toggle-root'){toggleRoot(id);return;}
 if(action==='remove-root'||action==='remove-connection'){openRemove(action==='remove-root'?'root':'connection',id);return;}
 if(action==='remove-rule'){state.commandRules=state.commandRules.filter(x=>x.id!==id);state.customRules=state.customRules.filter(x=>x.id!==id);record('permissionEvent','directory',state.rootFocus);renderAll();return;}
 if(action==='scope-all'){state.rootFocus='';state.selection={type:'workspace',id:''};$('rootSearch').value='';renderRoots();return;}
 if(['connect','reconnect','disconnect'].includes(action)){previewConnection(id,action);return;}
 if(action==='export'){showExport();return;}
 if(action==='reset-filters'){['logWorkspace','logTransport','logCategory','logFrom','logUntil','logSearch','logFilter'].forEach(id=>$(id).value='');renderLogs();return;}
 if(action==='check-update'){state.updateChecked=true;renderSettings();showMaintenance(tr('updateResult'),'<p>'+esc(tr('updateHelp'))+'</p>');return;}
 if(action==='check-health'){state.healthChecked=true;state.healthReport=healthChecks();renderSettings();showMaintenance(tr('healthReport'),healthMarkup());return;}
 if(action==='health-report'){showMaintenance(tr('healthReport'),healthMarkup());return;}
 if(action==='create-backup'){createBackup();toast(tr('backupCreated'));return;}
 if(action==='restore-backup'&&state.backup){state.maintenance={type:'restore'};$('maintenanceTitle').textContent=tr('backupRestore');$('maintenanceBody').innerHTML='<p>'+esc(tr('backupWarning'))+'</p>';$('maintenanceConfirm').hidden=false;$('maintenanceConfirm').textContent=tr('restoreBackup');openDialog('maintenanceDialog','maintenanceClose');}
}

 $('folderPicker').addEventListener('change',event=>folderPicked(event.target.files));
 document.addEventListener('change',event=>{
  const el=event.target;if(el.id==='themeSelect')setTheme(el.value);if(el.id==='languageSelect')setLocale(el.value);if(el.id==='fontSizeSelect')setFontSize(el.value);
  if(el.id==='activeConnectionSelect'){state.activeConnectionId=el.value;renderOverview();}
  if(el.id==='itemTransport'&&!state.editConnectionId)$('itemPort').value=el.value==='cloudflare'?8788:8787;
  if(el.id==='permissionRoot')renderPermissionRules();
 });
 $('editForm').addEventListener('submit',event=>{
  event.preventDefault();const name=$('itemName').value.trim();if(!name)return;
  if(state.editType==='root'){if(!saveRootForm(name,$('itemPath').value.trim()))return;}
  else{const config={transport:$('itemTransport').value,port:$('itemPort').value,profile:$('itemProfile').value.trim()};if(state.editConnectionId){if(!editConnection(state.editConnectionId,name,config))return;}else if(!addConnection(name,config))return;}
  closeDialog($('editDialog'));navigate(state.editType==='root'?'access':'connections');
 });
 $('itemPath').addEventListener('input',()=> $('itemPath').setCustomValidity(''));
 $('confirmRemove').addEventListener('click',()=>{const item=state.pendingRemoval;if(item)removeItem(item.type,item.id);state.pendingRemoval=null;closeDialog($('confirmDialog'));});
 $('permissionForm').addEventListener('submit',event=>{event.preventDefault();const ids=[...document.querySelectorAll('input[name="commandRule"]:checked')].map(el=>el.value);if(savePermissions($('developerMode').checked,$('permissionRoot').value,ids,$('customPattern').value))closeDialog($('permissionDialog'));});
 $('maintenanceConfirm').addEventListener('click',()=>{if(state.maintenance?.type==='command'){confirmCommand(state.maintenance.id);return;}if(state.maintenance?.type==='restore'&&restoreBackup())closeDialog($('maintenanceDialog'));});
 document.querySelectorAll('dialog').forEach(dialog=>{
  dialog.addEventListener('close',()=>{if(dialog.id==='confirmDialog')state.pendingRemoval=null;if(dialog.id==='maintenanceDialog')state.maintenance=null;const old=state.dialogReturn.get(dialog);state.dialogReturn.delete(dialog);requestAnimationFrame(()=>{if(old?.isConnected)old.focus();else document.querySelector('.page.active .page-title')?.focus();});});
 });
 document.addEventListener('keydown',event=>{if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='k'){event.preventDefault();if(!document.querySelector('dialog[open]'))openDialog('navDialog','navTitle');}if(event.key==='Escape'&&!document.querySelector('dialog[open]'))closeDrawers();});
 window.addEventListener('resize',()=>{closeDrawers();});
}

function boot(){if(!document.querySelector('.app'))return;bindUI();renderAll();}
state.logs.forEach((x,index)=>{
 const date=new Date();const parts=x.time.split(':').map(Number);date.setHours(parts[0],parts[1],parts[2],0);x.createdAt=date.toISOString();
 const root=state.roots.find(r=>r.id===x.target);x.workspaceId=root?.id||'';x.workspaceName=root?.name||'';x.transport=index===3?'cloudflare':'openai';x.connectionId=index===3?'demo-connection-02':'demo-connection-01';
});
boot();
</script>
</body>
</html>
