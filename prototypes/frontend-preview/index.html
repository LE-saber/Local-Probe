.shell{min-height:100vh;display:grid;grid-template-columns:248px 1fr}.sidebar{background:var(--panel);border-right:1px solid var(--line);padding:26px 17px;display:flex;flex-direction:column;gap:28px}.brand{display:flex;align-items:center;gap:11px;padding:0 9px}.mark{display:grid;place-items:center;width:39px;height:39px;border-radius:13px;background:var(--green);color:#fff;font-weight:800;letter-spacing:-2px;font-size:17px}.brand strong{display:block;font-size:16px;letter-spacing:-.3px}.brand small,.muted{color:var(--muted)}.nav-label{padding:0 12px;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:1.1px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;border-radius:10px;text-align:left;padding:11px 12px;color:var(--muted);display:flex;align-items:center;gap:12px}.nav button:hover{background:var(--panel2);color:var(--text)}.nav button[aria-current="page"]{background:var(--green2);color:var(--green);font-weight:650}.nav .ico{width:20px;text-align:center;font-size:16px}.side-note{margin-top:auto;padding:15px;border:1px solid var(--line);border-radius:14px;background:var(--panel2);font-size:12px;color:var(--muted)}.side-note b{color:var(--text);display:block;margin-bottom:5px}.main{min-width:0}.topbar{height:76px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(22px,4vw,58px);border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 84%,transparent);position:sticky;top:0;z-index:2;backdrop-filter:blur(12px)}.eyebrow{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--muted)}.sample{padding:5px 9px;border:1px solid #d6e7d9;border-radius:99px;color:var(--green);background:var(--green2);font-weight:650}.top-actions{display:flex;align-items:center;gap:10px}.scenario{max-width:190px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--text);padding:8px 10px}.avatar{border:0;background:var(--green);color:#fff;border-radius:50%;width:34px;height:34px;font-weight:700}
.content{max-width:1440px;padding:34px clamp(22px,4vw,58px) 64px;margin:auto}.page-title{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:25px}.page-title h1{font-size:clamp(26px,3vw,36px);line-height:1.12;letter-spacing:-1px;margin:0 0 8px}.page-title p{color:var(--muted);margin:0}.kicker{color:var(--green);font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;margin:0 0 10px}.btn{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:9px 13px;font-weight:600;transition:.15s}.btn:hover:not(:disabled){border-color:var(--green);transform:translateY(-1px)}.btn:disabled{opacity:.5;cursor:not-allowed}.btn.primary{background:var(--green);border-color:var(--green);color:#fff}.btn.ghost{background:transparent}.btn.danger{color:var(--red)}.pill{display:inline-flex;align-items:center;gap:7px;border-radius:99px;padding:5px 10px;font-size:12px;font-weight:650;background:var(--panel2);color:var(--muted)}.pill.good{background:var(--green2);color:var(--green)}.pill.warn{background:#fbf2dd;color:var(--amber)}[data-theme="dark"] .pill.warn{background:#493b20}.pill.bad{background:#f8e8e6;color:var(--red)}.dot{width:7px;height:7px;border-radius:50%;background:currentColor}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.hero{padding:clamp(24px,4vw,44px);display:grid;grid-template-columns:1.25fr .75fr;gap:30px;align-items:center;background:linear-gradient(115deg,var(--panel),var(--green2));overflow:hidden}.hero h2{font-size:clamp(28px,4vw,43px);line-height:1.16;letter-spacing:-1.5px;max-width:660px;margin:8px 0 15px}.hero p{color:var(--muted);max-width:610px;margin:0 0 22px}.hero-actions{display:flex;gap:9px;flex-wrap:wrap}.hero-art{padding:21px;background:var(--panel);border:1px solid var(--line);border-radius:15px;min-width:0}.flow{display:grid;gap:12px;margin-top:15px}.flow-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);font-size:13px}.flow-row span:first-child{display:flex;align-items:center;gap:9px}.flow-row i{font-style:normal;color:var(--green);font-weight:800}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:18px 0}.stat{padding:18px 20px}.stat small{color:var(--muted)}.stat strong{display:block;font-size:26px;letter-spacing:-1px;margin-top:5px}.grid2{display:grid;grid-template-columns:1.1fr .9fr;gap:15px}.section-card{padding:20px}.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px}.card-head h3{margin:0;font-size:16px}.text-link{border:0;background:none;color:var(--green);font-weight:650;padding:4px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}.row:first-of-type{border-top:0}.row strong{display:block;font-size:14px}.row small{display:block;color:var(--muted);font-size:12px}.provider{display:flex;align-items:center;gap:12px}.provider-icon{width:36px;height:36px;border-radius:11px;background:var(--green2);display:grid;place-items:center;color:var(--green);font-weight:800}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.field{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:9px;padding:10px 11px;min-width:0}.field:focus,button:focus-visible{outline:3px solid #4a956e55;outline-offset:2px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);white-space:nowrap}.table th{color:var(--muted);font-weight:600}.table tr:last-child td{border-bottom:0}.switch{width:40px;height:23px;border:0;border-radius:99px;background:#abb5ae;padding:3px}.switch:after{content:"";display:block;width:17px;height:17px;border-radius:50%;background:#fff;transition:.15s}.switch[aria-checked="true"]{background:var(--green)}.switch[aria-checked="true"]:after{transform:translateX(17px)}.empty{padding:35px;text-align:center;color:var(--muted)}.notice{padding:14px 16px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;color:var(--muted);font-size:13px}.provider-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.provider-card{padding:18px;border:1px solid var(--line);border-radius:14px;background:var(--panel);text-align:left}.provider-card[aria-pressed="true"]{border:2px solid var(--green);background:var(--green2)}.provider-card strong{display:block;margin:9px 0 4px}.provider-card p{margin:0;color:var(--muted);font-size:13px}.stack{display:grid;gap:14px}.rule{padding:14px 0;border-top:1px solid var(--line)}.rule:first-child{border-top:0}.rule b{display:block}.small{font-size:12px;color:var(--muted)}
dialog{border:1px solid var(--line);border-radius:18px;padding:0;background:var(--panel);color:var(--text);width:min(560px,calc(100% - 28px));max-height:min(90vh,780px);box-shadow:0 24px 90px #0003}dialog::backdrop{background:#111a16a3;backdrop-filter:blur(3px)}.dialog-body{padding:23px}.dialog-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:17px}.dialog-head h2{font-size:21px;margin:0 0 4px}.x{border:0;background:var(--panel2);border-radius:8px;width:34px;height:34px;font-size:19px}.form-row{display:grid;gap:6px;margin:13px 0}.form-row label{font-size:13px;font-weight:650}.form-row .field{width:100%}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.error{color:var(--red);min-height:20px;font-size:13px}.footer-line{padding-top:16px;color:var(--muted);font-size:12px}
@media(max-width:900px){.shell{grid-template-columns:76px 1fr}.sidebar{padding:20px 10px;align-items:center}.brand{padding:0}.brand-copy,.nav-label,.nav .label,.side-note{display:none}.nav button{width:48px;height:48px;justify-content:center;padding:0}.nav .ico{font-size:18px}.hero{grid-template-columns:1fr}.hero-art{max-width:none}.grid2{grid-template-columns:1fr}}

:root{--on-accent:#fff}[data-theme="dark"]{--on-accent:#132a1d}
body{font-family:"Segoe UI","Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif}
.btn.primary,.avatar,.mark{color:var(--on-accent)}.pill{white-space:nowrap}.pill.bad{background:color-mix(in srgb,var(--red) 12%,var(--panel))}
.hero{grid-template-columns:1fr 1fr;padding:28px;gap:24px}.hero h2{font-size:clamp(27px,2.5vw,36px);letter-spacing:-.8px}.hero p{font-size:14px}.hero .card{box-shadow:none}.hero .section-card{padding:18px}.hero .provider h3{font-size:14px}.hero .provider-icon{flex-shrink:0}
.row>div:first-child{overflow-wrap:anywhere}.status-message{margin-top:14px}.eyebrow .sample{white-space:nowrap}

<body><a class="skip" href="#content">跳到主要内容</a><div class="shell">
<aside class="sidebar"><div class="brand"><div class="mark" aria-hidden="true">LP</div><div class="brand-copy"><strong>Local-Probe</strong><small>本地工作台</small></div></div><div class="nav-label">工作台</div><nav class="nav" aria-label="主导航">
<button data-page="overview" aria-current="page"><span class="ico">◫</span><span class="label">概览</span></button><button data-page="connections"><span class="ico">⌁</span><span class="label">连接</span></button><button data-page="folders"><span class="ico">▣</span><span class="label">授权文件夹</span></button><button data-page="logs"><span class="ico">≡</span><span class="label">活动日志</span></button><button data-page="settings"><span class="ico">⚙</span><span class="label">设置</span></button></nav><div class="side-note"><b>访问范围始终由你决定</b>ChatGPT 只能读取已授权的项目目录。此页面是离线交互样品，所有状态均为模拟。</div></aside>
<div class="main"><header class="topbar"><div class="eyebrow"><span class="sample">交互样品 · 模拟数据</span><span>本地管理界面预览</span></div><div class="top-actions"><label class="small" for="scenarioTop">验证场景</label><select class="scenario" id="scenarioTop" aria-label="切换模拟场景"><option value="normal">正常连接</option><option value="first">首次配置</option><option value="auth">凭据错误</option><option value="offline">本机离线</option></select><button class="avatar" aria-label="演示用户">LP</button></div></header><main class="content" id="content" tabindex="-1"></main></div></div>
<dialog id="dialog" aria-labelledby="dialogTitle"><div class="dialog-body" id="dialogBody"></div></dialog><div id="live" class="skip" aria-live="polite"></div>
<script>
const KEY='local-probe-preview-v1', scenarios=['normal','first','auth','offline'];
const seedFolders=[{id:'root-a',name:'Local-Probe 项目',path:'C:\\Workspaces\\Local-Probe',enabled:true},{id:'root-b',name:'研究资料',path:'D:\\Workspaces\\Research',enabled:true},{id:'root-c',name:'归档样例',path:'D:\\Archive\\Samples',enabled:false}];
const seedLogs=[['connection','连接就绪','OpenAI Secure MCP Tunnel','本机连接样品状态已就绪。ChatGPT 尚未验收。','成功'],['workspace','授权范围已更新','Local-Probe 项目','授权目录状态已更新（模拟）。','成功'],['security','访问策略已加载','只读工作区规则','命令执行和文件写入仍关闭。','信息'],['connection','Tunnel 健康检查','Cloudflare Tunnel','该记录为离线样例数据。','成功']];
function defaults(){return {scenario:'normal',transport:'openai_runtime',phase:'ready',folders:structuredClone(seedFolders),logs:seedLogs.map((x,i)=>({id:'log-'+i,category:x[0],event:x[1],target:x[2],detail:x[3],result:x[4],time:new Date(Date.now()-i*3600000).toISOString()})),theme:'light',scale:'normal'}}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY)||'null'),s=defaults();if(!d)return s;if(scenarios.includes(d.scenario))s.scenario=d.scenario;if(['openai_runtime','cloudflare'].includes(d.transport))s.transport=d.transport;if(['ready','idle','offline','auth','stopped'].includes(d.phase))s.phase=d.phase;if(['light','dark'].includes(d.theme))s.theme=d.theme;if(['normal','large','largest'].includes(d.scale))s.scale=d.scale;if(Array.isArray(d.folders))s.folders=d.folders.filter(f=>f&&typeof f.id==='string'&&typeof f.name==='string'&&validPath(f.path)).map(f=>({id:f.id,name:f.name.slice(0,80),path:f.path,enabled:!!f.enabled})).slice(0,100);if(Array.isArray(d.logs))s.logs=d.logs.filter(l=>l&&typeof l.event==='string').slice(0,100);if(s.scenario==='first')s.phase='idle';if(s.scenario==='offline')s.phase='offline';if(s.scenario==='auth')s.phase='auth';return s}catch{return defaults()}}
let state=load(),page='overview',timer=null,filter='all',query='';
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function validPath(raw){if(typeof raw!=='string')return false;const p=raw.trim().replaceAll('/','\\');return /^[a-zA-Z]:\\/.test(p)&&!/(^|\\)\.\.?($|\\)/.test(p)&&!/[<>"|?*\x00-\x1f]/.test(p)&&!p.slice(2).includes(':')}
function pathKey(raw){return raw.trim().replaceAll('/','\\').replace(/\\+$/,'').toLowerCase()}
function status(){return ({ready:['本机已就绪','good'],idle:['尚未配置','warn'],offline:['本机离线','bad'],auth:['凭据错误','bad'],stopped:['已断开','warn'],connecting:['正在连接','warn']})[state.phase]||['状态未知','warn']}
function log(category,event,target,detail,result='信息'){state.logs.unshift({id:'log-'+Date.now()+Math.random(),category,event,target,detail,result,time:new Date().toISOString()});state.logs=state.logs.slice(0,100);save()}
const title={overview:['概览','你的本地项目访问状态一览'],connections:['连接','管理本机与 Tunnel 的模拟连接流程'],folders:['授权文件夹','选择 ChatGPT 可以访问的本地项目范围'],logs:['活动日志','查看并导出这份样品中的模拟事件'],settings:['设置','调整样品显示、验证场景与只读能力摘要']};
function pill(text,kind=''){return '<span class="pill '+kind+'"><i class="dot"></i>'+esc(text)+'</span>'}
function statusCard(){const st=status(),provider=state.transport==='openai_runtime'?'OpenAI Secure MCP Tunnel':'Cloudflare Tunnel';return '<section class="card section-card"><div class="card-head"><div class="provider"><div class="provider-icon">⌁</div><div><h3>'+provider+'</h3><small class="muted">本地连接状态 · 模拟</small></div></div>'+pill(st[0],st[1])+'</div><div class="flow"><div class="flow-row"><span><i>01</i>本机 MCP 服务</span><b>'+esc(st[0])+'</b></div><div class="flow-row"><span><i>02</i>Tunnel 通道</span><b>'+((state.phase==='ready')?'已连接（模拟）':'待连接')+'</b></div><div class="flow-row"><span><i>03</i>ChatGPT 工具验收</span>'+pill('尚未验收','warn')+'</div></div><div class="toolbar" style="margin-top:16px">'+connectionButtons()+'</div><p class="small" style="margin:13px 0 0">本机 ready 不代表 ChatGPT 已发现或调用工具。此样品不会启动服务或访问网络。</p></section>'}
function connectionButtons(){if(state.phase==='connecting')return '<button class="btn" data-action="cancel">取消连接</button>';if(state.phase==='ready')return '<button class="btn" data-action="reconnect">重新连接</button><button class="btn danger" data-action="disconnect">断开连接</button>';if(state.scenario==='first')return '<button class="btn primary" data-action="setup">开始配置</button>';return '<button class="btn primary" data-action="connect">重试连接</button><button class="btn" data-action="setup">连接设置</button>'}
function connectionNotice(){if(state.phase==='auth')return '<div class="notice status-message" role="status">凭据验证失败（模拟）。请在连接设置中更新配置状态，然后重试。<br><button class="text-link" data-action="recover">模拟修复凭据并重试 →</button></div>';if(state.phase==='offline')return '<div class="notice status-message" role="status">本机网络不可用（模拟）。离线时可继续管理样品授权范围。<br><button class="text-link" data-action="recover">模拟网络恢复并重试 →</button></div>';return ''}
function overview(){const active=state.folders.filter(f=>f.enabled).length;return '<p class="kicker">LOCAL WORKSPACE</p><section class="card hero"><div><span class="pill good">为本地项目建立清晰边界</span><h2>让 ChatGPT 访问你授权的本地项目</h2><p>管理连接状态与文件夹访问范围。授权由本机管理，样品中的所有连接、路径与活动都是模拟数据。</p><div class="hero-actions"><button class="btn primary" data-action="'+(state.phase==='ready'?'disconnect':'connect')+'">'+(state.phase==='ready'?'断开样品连接':'连接本机服务')+'</button><button class="btn" data-page="folders">管理授权文件夹</button></div></div><div>'+statusCard()+'</div></section><div class="stats"><div class="card stat"><small>当前授权文件夹</small><strong>'+active+' <span class="small">/ '+state.folders.length+' 个</span></strong></div><div class="card stat"><small>连接方式</small><strong style="font-size:18px">'+(state.transport==='openai_runtime'?'OpenAI Tunnel':'Cloudflare')+'</strong></div><div class="card stat"><small>ChatGPT 端验收</small><strong style="font-size:18px">尚未验收</strong></div></div><div class="grid2"><section class="card section-card"><div class="card-head"><h3>授权范围</h3><button class="text-link" data-page="folders">管理文件夹 →</button></div>'+state.folders.filter(f=>f.enabled).slice(0,3).map(f=>'<div class="row"><div class="provider"><div class="provider-icon">▣</div><div><strong>'+esc(f.name)+'</strong><small>'+esc(f.path)+'</small></div></div>'+pill('已授权','good')+'</div>').join('')+'</section><section class="card section-card"><div class="card-head"><h3>最近活动</h3><button class="text-link" data-page="logs">查看日志 →</button></div>'+state.logs.slice(0,3).map(l=>'<div class="row"><div><strong>'+esc(l.event)+'</strong><small>'+esc(l.target)+' · '+new Date(l.time).toLocaleString('zh-CN',{hour:'2-digit',minute:'2-digit'})+'</small></div>'+pill(l.result,l.result==='成功'?'good':'')+'</div>').join('')+'</section></div>'}
function connections(){const st=status();return '<div class="page-title"><div><p class="kicker">CONNECTION</p><h1>连接</h1><p>选择一条本机连接路径；这只是交互演示，不会连接真实服务。</p></div><button class="btn" data-action="setup">分步设置</button></div><div class="provider-grid"><button class="provider-card" data-action="transport" data-value="openai_runtime" aria-pressed="'+(state.transport==='openai_runtime')+'"><span class="provider-icon">O</span><strong>OpenAI Secure MCP Tunnel</strong><p>官方 tunnel-client · 本地端口 8787。凭据只显示模拟配置状态。</p></button><button class="provider-card" data-action="transport" data-value="cloudflare" aria-pressed="'+(state.transport==='cloudflare')+'"><span class="provider-icon">C</span><strong>Cloudflare Tunnel</strong><p>cloudflared + Access · 本地端口 8788。凭据只显示模拟配置状态。</p></button></div><div style="margin-top:15px">'+statusCard()+'</div><section class="notice" style="margin-top:15px"><b>状态边界</b><br>「本机已就绪」仅为样品状态。真实版本还需在目标 ChatGPT workspace 手动确认工具可发现并成功调用；本页面不会伪造验收结果。</section>'}
function folders(){return '<div class="page-title"><div><p class="kicker">WORKSPACE ACCESS</p><h1>授权文件夹</h1><p>启用的目录构成示例访问范围；撤销仅移除授权，不删除磁盘文件。</p></div><button class="btn primary" data-action="add">＋ 添加文件夹</button></div><div class="card section-card"><div class="card-head"><div><h3>'+state.folders.filter(f=>f.enabled).length+' 个已授权</h3><small class="muted">路径和授权均保存在此浏览器的样品状态中</small></div><input class="field" id="folderSearch" placeholder="搜索名称或路径" aria-label="搜索授权文件夹"></div><div id="folderList">'+folderRows(query)+'</div></div><p class="footer-line">样品仅检查绝对盘符路径格式，不检查文件夹是否存在、磁盘类型或 reparse point；正式授权须由本机 workspace manager 验证。</p>'}
function folderRows(q=''){const fs=state.folders.filter(f=>(f.name+' '+f.path).toLowerCase().includes(q.toLowerCase()));if(!fs.length)return '<div class="empty">没有匹配的文件夹</div>';return fs.map(f=>'<div class="row"><div style="min-width:0"><strong>'+esc(f.name)+'</strong><small>'+esc(f.path)+'</small></div><div class="toolbar">'+pill(f.enabled?'访问已启用':'已暂停',f.enabled?'good':'')+'<button class="switch" role="switch" aria-checked="'+f.enabled+'" aria-label="切换 '+esc(f.name)+' 的授权" data-action="toggle-folder" data-id="'+esc(f.id)+'"></button><button class="btn" data-action="edit" data-id="'+esc(f.id)+'">编辑</button><button class="btn danger" data-action="revoke" data-id="'+esc(f.id)+'">撤销</button></div></div>').join('')}
function logs(){return '<div class="page-title"><div><p class="kicker">ACTIVITY</p><h1>活动日志</h1><p>样品事件为预置或本次模拟交互生成，不包含凭据。</p></div><button class="btn" data-action="export-logs">导出 JSON</button></div><div class="card section-card"><div class="toolbar" style="margin-bottom:12px"><input class="field" id="logSearch" placeholder="搜索活动" aria-label="搜索活动日志" value="'+esc(query)+'"><select class="field" id="logFilter" aria-label="按类别筛选"><option value="all">所有类别</option><option value="connection">连接</option><option value="workspace">授权</option><option value="security">安全</option><option value="settings">设置</option></select><span class="small" id="logCount"></span></div><div class="table-wrap"><table class="table"><thead><tr><th>时间</th><th>类别</th><th>活动</th><th>对象</th><th>结果</th><th></th></tr></thead><tbody id="logRows">'+logRows()+'</tbody></table></div></div>'}
function logRows(){const rows=state.logs.filter(l=>(filter==='all'||l.category===filter)&&[l.event,l.target,l.detail,l.category].join(' ').toLowerCase().includes(query.toLowerCase()));document.getElementById('logCount')?.replaceChildren(document.createTextNode(rows.length+' 条'));return rows.map(l=>'<tr><td>'+new Date(l.time).toLocaleString('zh-CN')+'</td><td>'+esc(({connection:'连接',workspace:'授权',security:'安全',settings:'设置'})[l.category]||'活动')+'</td><td>'+esc(l.event)+'</td><td>'+esc(l.target)+'</td><td>'+esc(l.result)+'</td><td><button class="text-link" data-action="log-detail" data-id="'+esc(l.id)+'">详情</button></td></tr>').join('')||'<tr><td colspan="6" class="empty">没有匹配的活动</td></tr>'}
function settings(){return '<div class="page-title"><div><p class="kicker">PREFERENCES</p><h1>设置</h1><p>此处调整仅作用于本地交互样品。</p></div></div><div class="grid2"><section class="card section-card stack"><div class="card-head"><h3>验证场景</h3></div><label class="form-row">切换状态样例<select class="field" id="scenarioSettings"><option value="normal">正常连接</option><option value="first">首次配置</option><option value="auth">凭据错误</option><option value="offline">本机离线</option></select></label><p class="small">场景切换仅更新模拟数据，不会检查网络或读取本机凭据。</p><label class="form-row">外观<select class="field" id="themeSelect"><option value="light">浅色</option><option value="dark">深色</option></select></label><label class="form-row">字号<select class="field" id="scaleSelect"><option value="normal">标准</option><option value="large">较大</option><option value="largest">最大</option></select></label><div class="toolbar"><button class="btn" data-action="feedback">下载反馈记录 JSON</button><button class="btn danger" data-action="reset">重置样品</button></div></section><section class="card section-card"><div class="card-head"><h3>Developer Rules · 只读预览</h3><span class="pill warn">不可编辑</span></div><div class="rule"><b>允许范围</b><span class="small">仅限已启用的示例文件夹</span></div><div class="rule"><b>文件读取</b><span class="small">只读；样品不会读取真实文件</span></div><div class="rule"><b>命令执行</b><span class="small">关闭 · 不提供任意终端或命令编辑</span></div><div class="rule"><b>写入文件</b><span class="small">关闭 · 未提供文件修改能力</span></div></section></div><p class="footer-line">连接凭据从未要求输入或展示。OpenAI Runtime key、Tunnel ID、Cloudflare token 等真实秘密不会被样品访问。</p>'}
function render(){
 document.documentElement.dataset.theme=state.theme;document.documentElement.dataset.scale=state.scale;
 document.getElementById('scenarioTop').value=state.scenario;document.title='Local-Probe · '+title[page][0];
 document.querySelectorAll('.nav [data-page]').forEach(b=>{if(b.dataset.page===page)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
 const main=document.getElementById('content');main.innerHTML=page==='overview'?overview():page==='connections'?connections():page==='folders'?folders():page==='logs'?logs():settings();
 if(page==='overview'){
  const headline=main.querySelector('.hero h2');headline.outerHTML='<h1 style="font-size:clamp(27px,2.5vw,36px);line-height:1.3;margin:10px 0 15px">本地项目，由你掌控访问。</h1>';
  const primary=main.querySelector('.hero-actions .primary');primary.dataset.action=state.phase==='connecting'?'cancel':state.phase==='ready'?'reconnect':state.scenario==='first'?'setup':'connect';
  primary.textContent=state.phase==='connecting'?'取消连接':state.phase==='ready'?'重新连接':state.scenario==='first'?'开始配置':'连接本机服务';
 }
 if(page==='overview'||page==='connections')main.insertAdjacentHTML('beforeend',connectionNotice());
 const values={scenarioSettings:state.scenario,themeSelect:state.theme,scaleSelect:state.scale,logFilter:filter,folderSearch:query};
 for(const [id,value] of Object.entries(values)){const el=document.getElementById(id);if(el)el.value=value}
 if(page==='logs')document.getElementById('logRows').innerHTML=logRows();
}
let dialogOpener=null;
function openDialog(html){const d=document.getElementById('dialog');if(!d.open)dialogOpener=document.activeElement;document.getElementById('dialogBody').innerHTML=html;if(!d.open)d.showModal();(d.querySelector('[autofocus]')||d.querySelector('button'))?.focus()}
function closeDialog(){document.getElementById('dialog').close()}
function addForm(folder){const editing=!!folder;openDialog('<div class="dialog-head"><div><p class="kicker">FOLDER ACCESS</p><h2 id="dialogTitle">'+(editing?'編輯显示名称':'添加授权文件夹')+'</h2><div class="small">仅为样品登记，不会修改本机权限。</div></div><button class="x" data-action="close" aria-label="关闭">×</button></div><form id="folderForm" data-id="'+esc(folder?.id||'')+'"><div class="form-row"><label for="folderName">显示名称</label><input class="field" id="folderName" name="name" maxlength="80" required value="'+esc(folder?.name||'')+'" autofocus></div><div class="form-row"><label for="folderPath">绝对文件夹路径</label><input class="field" id="folderPath" name="path" maxlength="260" '+(editing?'readonly':'required')+' value="'+esc(folder?.path||'')+'" placeholder="例如 C:\\Projects\\My-App"><span class="small">接受盘符绝对路径；拒绝相对路径、.. 与 UNC 网络路径。</span></div><div class="error" id="formError" role="alert"></div><div class="dialog-actions"><button type="button" class="btn" data-action="close">取消</button><button class="btn primary" type="submit">'+(editing?'保存名称':'添加样品目录')+'</button></div></form>')}
function confirmRevoke(f){openDialog('<div class="dialog-head"><div><p class="kicker">REVOKE ACCESS</p><h2 id="dialogTitle">撤销文件夹授权？</h2></div><button class="x" data-action="close" aria-label="关闭">×</button></div><p><b>'+esc(f.name)+'</b><br><span class="small">'+esc(f.path)+'</span></p><div class="notice">这只会从样品访问范围移除此授权，不会删除磁盘上的文件夹或文件。</div><div class="dialog-actions"><button class="btn" data-action="close">保留授权</button><button class="btn danger" data-action="confirm-revoke" data-id="'+esc(f.id)+'">确认撤销</button></div>')}
function setup(){const cloud=state.transport==='cloudflare';openDialog('<div class="dialog-head"><div><p class="kicker">连接向导 · 第 1 步 / 2</p><h2 id="dialogTitle">选择连接方案</h2><p class="small">只展示方案和模拟状态，不采集密钥。</p></div><button class="x" data-action="close" aria-label="关闭">×</button></div><div class="provider-grid"><button class="provider-card" data-action="transport-dialog" data-value="openai_runtime" aria-pressed="'+(!cloud)+'"><strong>OpenAI Secure MCP Tunnel</strong><p>官方 tunnel-client · 本地端口 8787</p></button><button class="provider-card" data-action="transport-dialog" data-value="cloudflare" aria-pressed="'+cloud+'"><strong>Cloudflare Tunnel</strong><p>cloudflared + Access · 本地端口 8788</p></button></div><div class="notice" style="margin-top:14px"><b>配置凭据</b><br>模拟状态：'+(state.scenario==='first'?'尚未配置':'已配置（仅状态标记）')+'。样品不会让你输入、读取或显示 key、token、Tunnel ID。</div><div class="dialog-actions"><button class="btn" data-action="close">稍后</button><button class="btn primary" data-action="setup-next">继续查看状态</button></div>')}
function connect(){if(state.scenario==='first'){setup();return}clearTimeout(timer);state.phase='connecting';save();log('connection','开始连接','本机连接','开始模拟连接流程。');render();timer=setTimeout(()=>{state.phase=state.scenario==='auth'?'auth':state.scenario==='offline'?'offline':'ready';save();log('connection',state.phase==='ready'?'本机已就绪':'连接未完成',state.transport==='cloudflare'?'Cloudflare Tunnel':'OpenAI Secure MCP Tunnel',state.phase==='ready'?'模拟连接完成；ChatGPT 尚未验收。':'模拟场景阻止了连接。',state.phase==='ready'?'成功':'失败');render();document.getElementById('live').textContent=status()[0]},1800)}
function setScenario(s){if(!scenarios.includes(s))return;clearTimeout(timer);state.scenario=s;state.phase=({normal:'ready',first:'idle',auth:'auth',offline:'offline'})[s];save();log('settings','切换验证场景','样品状态','已切换到'+({normal:'正常连接',first:'首次配置',auth:'凭据错误',offline:'本机离线'})[s]+'模拟数据。');render()}
function download(name,data){const a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.page){page=b.dataset.page;query='';render();document.getElementById('content').focus();return}
 const id=b.dataset.id,f=state.folders.find(x=>x.id===id);
 switch(b.dataset.action){
  case'connect':case'reconnect':connect();break;
  case'cancel':case'disconnect':clearTimeout(timer);state.phase='stopped';save();log('connection',b.dataset.action==='cancel'?'连接已取消':'连接已断开','本机连接','模拟连接已停止。');render();break;
  case'setup':setup();break;
  case'transport':case'transport-dialog':
   clearTimeout(timer);state.transport=b.dataset.value;state.phase=state.scenario==='first'?'idle':'stopped';save();
   log('connection','切换连接方式','连接设置','样品已停止旧连接，请连接新通道。');
   if(b.dataset.action==='transport-dialog')setup();else render();break;
  case'setup-next':
   openDialog('<div class="dialog-head"><div><p class="kicker">连接向导 · 第 2 步 / 2</p><h2 id="dialogTitle">确认配置与访问范围</h2></div><button class="x" data-action="close" aria-label="关闭">×</button></div><p>所选方案：<b>'+esc(state.transport==='cloudflare'?'Cloudflare Tunnel':'OpenAI Secure MCP Tunnel')+'</b></p><div class="notice">演示中用「已配置」标记代替真实凭据。无需输入任何密钥。<br>已启用 '+state.folders.filter(f=>f.enabled).length+' 个样品文件夹；命令执行和写入关闭。<br>完成配置后仅模拟本机连接，ChatGPT 工具验收仍需另行完成。</div><div class="dialog-actions"><button class="btn" data-action="setup">上一步</button><button class="btn primary" data-action="setup-complete">模拟配置完成并连接</button></div>');break;
  case'setup-complete':case'recover':closeDialog();state.scenario='normal';state.phase='stopped';page='connections';log('settings','模拟配置已修复','样品状态','只更新模拟状态，未读取凭据或检查网络。');connect();break;
  case'add':addForm();break;
  case'edit':if(f)addForm(f);break;
  case'toggle-folder':if(f){f.enabled=!f.enabled;save();log('workspace',f.enabled?'启用文件夹访问':'暂停文件夹访问','授权范围','样品授权状态已更新。');render()}break;
  case'revoke':if(f)confirmRevoke(f);break;
  case'confirm-revoke':if(f){state.folders=state.folders.filter(x=>x.id!==id);save();log('workspace','撤销文件夹授权','授权范围','已撤销一个样品授权；未删除物理目录。','成功');closeDialog();render()}break;
  case'close':closeDialog();break;
  case'log-detail':{
   const l=state.logs.find(x=>x.id===id);if(l)openDialog('<div class="dialog-head"><div><p class="kicker">ACTIVITY DETAIL</p><h2 id="dialogTitle">'+esc(l.event)+'</h2></div><button class="x" data-action="close" aria-label="关闭">×</button></div><dl><dt>时间</dt><dd>'+new Date(l.time).toLocaleString('zh-CN')+'</dd><dt>类别</dt><dd>'+esc(l.category)+'</dd><dt>对象</dt><dd>'+esc(l.target)+'</dd><dt>结果</dt><dd>'+esc(l.result)+'</dd><dt>说明</dt><dd>'+esc(l.detail)+'</dd></dl><div class="dialog-actions"><button class="btn" data-action="close">完成</button></div>');break;
  }
  case'export-logs':download('local-probe-sample-activity.json',{sample:true,exportedAt:new Date().toISOString(),records:state.logs.map(({time,category,event,target,detail,result})=>({time,category,event,target,detail,result}))});break;
  case'feedback':download('local-probe-sample-feedback.json',{sample:true,exportedAt:new Date().toISOString(),scenario:state.scenario,events:state.logs.slice(0,20).map(l=>({time:l.time,category:l.category,event:l.event})),note:'仅记录样品交互事件，不含文件路径、密钥或文件内容；不代表用户验收通过。'});break;
  case'reset':openDialog('<div class="dialog-head"><div><h2 id="dialogTitle">重置交互样品？</h2><p class="small">清除本浏览器保存的样品状态并恢复示例数据。</p></div><button class="x" data-action="close" aria-label="关闭">×</button></div><div class="dialog-actions"><button class="btn" data-action="close">取消</button><button class="btn danger" data-action="confirm-reset">重置样品</button></div>');break;
  case'confirm-reset':clearTimeout(timer);state=defaults();page='overview';query='';filter='all';closeDialog();save();render();break;
 }
});
document.addEventListener('change',e=>{if(e.target.id==='scenarioTop'||e.target.id==='scenarioSettings')setScenario(e.target.value);if(e.target.id==='themeSelect'){state.theme=e.target.value;save();render()}if(e.target.id==='scaleSelect'){state.scale=e.target.value;save();render()}if(e.target.id==='logFilter'){filter=e.target.value;document.getElementById('logRows').innerHTML=logRows()}});
document.addEventListener('input',e=>{if(e.target.id==='folderSearch'){query=e.target.value;document.getElementById('folderList').innerHTML=folderRows(query)}if(e.target.id==='logSearch'){query=e.target.value;document.getElementById('logRows').innerHTML=logRows()}});
document.addEventListener('submit',e=>{
 if(e.target.id!=='folderForm')return;e.preventDefault();const fd=new FormData(e.target),name=String(fd.get('name')||'').trim(),path=String(fd.get('path')||'').trim(),old=state.folders.find(f=>f.id===e.target.dataset.id),err=document.getElementById('formError');
 if(!name){err.textContent='请填写显示名称。';return}
 if(!old&&!validPath(path)){err.textContent='请输入盘符开头的绝对路径；不接受相对路径、..、无效字符或 UNC 网络路径。';return}
 if(!old&&state.folders.some(f=>pathKey(f.path)===pathKey(path))){err.textContent='此路径已登记，请直接编辑或启用已有授权。';return}
 if(old){old.name=name.slice(0,80);log('workspace','编辑文件夹显示名称','授权范围','样品显示名称已更新。')}
 else{state.folders.unshift({id:'root-'+Date.now(),name:name.slice(0,80),path:path.replaceAll('/','\\'),enabled:true});log('workspace','添加文件夹授权','授权范围','添加了一个模拟授权目录。','成功')}
 save();closeDialog();query='';render();
});
document.getElementById('dialog').addEventListener('close',()=>{requestAnimationFrame(()=>{if(dialogOpener?.isConnected)dialogOpener.focus();else document.querySelector('.nav [aria-current]')?.focus()})});
document.getElementById('dialog').addEventListener('click',e=>{if(e.target===e.currentTarget)closeDialog()});render();
</script></body></html>
